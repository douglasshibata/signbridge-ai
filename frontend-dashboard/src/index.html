<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignBridge AI Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-8">
        <h1 class="text-4xl font-bold text-blue-600 mb-8">🤟 SignBridge AI</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-lg shadow-lg">
                <h2 class="text-2xl font-semibold mb-4">Webcam Feed</h2>
                <video id="webcam" autoplay playsinline class="w-full rounded-md border-2 border-gray-300"></video>
                <button id="start-btn" class="mt-4 bg-green-500 text-white px-6 py-2 rounded-full hover:bg-green-600">Start Translation</button>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-lg">
                <h2 class="text-2xl font-semibold mb-4">Real-time Translation</h2>
                <div id="output" class="text-3xl font-bold text-gray-800 h-48 flex items-center justify-center border-2 border-dashed border-gray-200 rounded-md">
                    Waiting for input...
                </div>
                <div id="status" class="mt-4 text-sm text-gray-500">Status: Disconnected</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
