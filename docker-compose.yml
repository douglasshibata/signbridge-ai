services:
  # AI Engine: Motor de Traducao (Python/GPU)
  ai-engine:
    build: ./ai-engine
    container_name: signbridge-ai-engine
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 8G
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp

  # Backend API: Orquestrador (Spring Boot + MediaPipe)
  backend-api:
    build: ./backend-api
    container_name: signbridge-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILE:-prod}
      - AI_ENGINE_URL=http://ai-engine:8000
    depends_on:
      ai-engine:
        condition: service_healthy
    networks:
      - backend-network
      - frontend-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Frontend Dashboard: Interface do Usuario (Angular/Tailwind)
  frontend-dashboard:
    build: ./frontend-dashboard
    container_name: signbridge-frontend
    ports:
      - "4200:80"
    depends_on:
      backend-api:
        condition: service_healthy
    networks:
      - frontend-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx

networks:
  backend-network:
    driver: bridge
    internal: true
  frontend-network:
    driver: bridge
